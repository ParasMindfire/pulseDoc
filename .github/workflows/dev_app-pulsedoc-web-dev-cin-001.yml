# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - app-pulsedoc-web-dev-cin-001

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Build React client
        run: |
          cd web_app/client
          npm install
          npm run build

      - name: Install server dependencies
        run: |
          cd web_app
          npm install --production

      - name: Remove client dev files not needed at runtime
        run: |
          rm -rf web_app/client/node_modules
          rm -rf web_app/client/src

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./web_app

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.<REPLACE_WITH_ACTUAL_CLIENTID_SECRET> }}
          tenant-id: ${{ secrets.<REPLACE_WITH_ACTUAL_TENANTID_SECRET> }}
          subscription-id: ${{ secrets.<REPLACE_WITH_ACTUAL_SUBSCRIPTIONID_SECRET> }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-pulsedoc-web-dev-cin-001'
          slot-name: 'Production'
          package: .
